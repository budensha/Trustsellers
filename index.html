<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COD Storefront</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="checkout-container">
  <h2>Cash on Delivery Checkout</h2>
  
  <form id="cod-form" name="cod-form">
    <div class="form-group">
      <label>Product</label>
      <input type="text" name="Product" value="Custom Product Name" readonly>
    </div>
    
    <div class="form-group">
      <label>Order Total</label>
      <input type="text" name="Order Total" value="₹1,200" readonly>
    </div>
    
    <div class="form-group">
      <label>Full Name</label>
      <input type="text" name="Customer Name" placeholder="Your Name" required>
    </div>
    
    <div class="form-group">
      <label>Phone Number</label>
      <input type="tel" name="Phone Number" placeholder="10-digit mobile number" required>
    </div>
    
    <div class="form-group">
      <label>Shipping Address</label>
      <textarea name="Shipping Address" rows="3" placeholder="Full house address, landmark, and pincode" required></textarea>
    </div>

    <div class="form-group">
      <label>Location (City/State)</label>
      <input type="text" name="Location" placeholder="e.g., Bengaluru, Karnataka" required>
    </div>
    
    <button type="submit" id="submit-btn">Place Order (COD)</button>
  </form>
  
  <div id="success-message" style="display:none;">
    Order Placed Successfully! We will ship your item soon.
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
